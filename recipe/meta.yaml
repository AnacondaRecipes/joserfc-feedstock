{% set name = "joserfc" %}
{% set version = "1.7.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b3bc561672ae541b17a9237053b48a03dacddd92d68047b3ecdfb4b5714a88ed

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - cryptography >=45.0.1

test:
  source_files: 
    - tests
  imports:
    - joserfc
  commands:
    - pip check
    - pytest -vv
  requires:
    - pip
    - pytest
    - pycryptodome

about:
  home: https://jose.authlib.org
  summary: Implementations of JOSE RFCs in Python
  description: |
    joserfc is a Python library that provides a comprehensive implementation of several essential JSON Object Signing and Encryption (JOSE) standards.
  dev_url: https://github.com/authlib/joserfc
  doc_url: https://jose.authlib.org
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD

extra:
  recipe-maintainers:
    - jan-janssen
